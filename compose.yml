services:
  foundry:
    image: felddy/foundryvtt:13
    hostname: foundry.local
    volumes:
      - type: bind
        source: ${FOUNDRY_DATA_PATH:-D:\Containers\Foundry}
        target: /data
    env_file:
      - .env
    environment:
      - FOUNDRY_PASSWORD=${FOUNDRY_PASSWORD}
      - FOUNDRY_USERNAME=${FOUNDRY_USERNAME}
      - FOUNDRY_ADMIN_KEY=${FOUNDRY_ADMIN_KEY}
      - FOUNDRY_RELEASE_URL=${FOUNDRY_RELEASE_URL}
    ports:
      - target: 30000
        published: 30000
        protocol: tcp