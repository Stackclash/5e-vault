<svg viewBox="0 0 900 660" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Floor plan of the Cinderworks: the boarded front gate is a dead end, the delivery tunnel off the outer wall is the real way in, opening onto the foundry floor, which connects to the kiln chamber and the stairs up to Crane's loft office.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="currentColor"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c17f2a"/>
    </marker>
  </defs>

  <text x="450" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="currentColor">The Cinderworks — Ground Floor &amp; Loft (schematic)</text>

  <!-- Street / outer wall edge, left side -->
  <line x1="10" y1="70" x2="10" y2="620" stroke="currentColor" stroke-width="3"/>
  <text x="24" y="640" font-size="13" fill="currentColor">disused outer wall</text>

  <!-- Boarded Front Gate (decoy, street-facing) -->
  <rect x="60" y="70" width="180" height="100" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="110" text-anchor="middle" font-size="15" fill="currentColor">Boarded Front Gate</text>
  <text x="150" y="130" text-anchor="middle" font-size="12" fill="currentColor">(street side — decoy,</text>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="currentColor">not the way in)</text>

  <!-- dashed connector gate -> foundry floor, showing it's blocked -->
  <line x1="240" y1="150" x2="330" y2="220" stroke="currentColor" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text x="245" y="200" font-size="12" fill="currentColor">boarded shut</text>

  <!-- Delivery Tunnel -->
  <rect x="30" y="440" width="200" height="120" fill="none" stroke="#c17f2a" stroke-width="2.5"/>
  <text x="130" y="480" text-anchor="middle" font-size="15" fill="currentColor">Delivery Tunnel</text>
  <text x="130" y="500" text-anchor="middle" font-size="12" fill="currentColor">re-touched warding sigils</text>
  <text x="130" y="518" text-anchor="middle" font-size="12" fill="currentColor">(Arcana DC 15 — maintained,</text>
  <text x="130" y="534" text-anchor="middle" font-size="12" fill="currentColor">not residual)</text>
  <circle cx="45" cy="455" r="6" fill="currentColor"/>
  <text x="58" y="459" font-size="11" fill="currentColor">watcher (DC 14 Stealth)</text>

  <!-- accent path: outer wall -> tunnel -> foundry floor (the actual infiltration route) -->
  <line x1="10" y1="500" x2="30" y2="500" stroke="#c17f2a" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <text x="10" y="590" font-size="12" fill="#c17f2a">actual entry point</text>
  <line x1="230" y1="480" x2="330" y2="400" stroke="#c17f2a" stroke-width="3" marker-end="url(#arrowAccent)"/>
  <text x="235" y="430" font-size="12" fill="#c17f2a">tunnel mouth into foundry floor</text>

  <!-- Foundry Floor (main hall / hub) -->
  <rect x="330" y="220" width="300" height="300" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="480" y="250" text-anchor="middle" font-size="16" font-weight="bold" fill="currentColor">Foundry Floor</text>
  <text x="480" y="270" text-anchor="middle" font-size="12" fill="currentColor">(the hub — ash-softened patches</text>
  <text x="480" y="286" text-anchor="middle" font-size="12" fill="currentColor">can give way underfoot)</text>

  <!-- collapsed gantry, jagged break line across upper foundry floor -->
  <polyline points="340,320 400,315 420,335 470,310 520,330 560,312 620,320" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="2 3"/>
  <text x="480" y="305" text-anchor="middle" font-size="11" fill="currentColor">collapsed gantry (overhead)</text>

  <!-- ash hazard patches -->
  <circle cx="400" cy="440" r="22" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <circle cx="520" cy="470" r="18" fill="currentColor" fill-opacity="0.15" stroke="currentColor" stroke-width="1"/>
  <text x="480" y="500" text-anchor="middle" font-size="11" fill="currentColor">ash-soft floor (hazard)</text>

  <!-- Foundry Floor -> Kiln Chamber -->
  <line x1="630" y1="360" x2="690" y2="360" stroke="currentColor" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="632" y="350" font-size="12" fill="currentColor">archway</text>

  <!-- Kiln Chamber -->
  <rect x="690" y="220" width="200" height="280" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="790" y="250" text-anchor="middle" font-size="15" font-weight="bold" fill="currentColor">Kiln Chamber</text>
  <text x="790" y="268" text-anchor="middle" font-size="12" fill="currentColor">three dead kilns,</text>
  <text x="790" y="283" text-anchor="middle" font-size="12" fill="currentColor">idle chain-falls overhead</text>
  <circle cx="740" cy="340" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="790" cy="390" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <circle cx="840" cy="340" r="24" fill="none" stroke="currentColor" stroke-width="2"/>
  <line x1="740" y1="316" x2="740" y2="290" stroke="currentColor" stroke-width="1.5"/>
  <line x1="840" y1="316" x2="840" y2="290" stroke="currentColor" stroke-width="1.5"/>

  <!-- Foundry Floor -> Loft Office (stairs up) -->
  <line x1="480" y1="220" x2="480" y2="160" stroke="currentColor" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="490" y="195" font-size="12" fill="currentColor">stairs up (creaky —</text>
  <text x="490" y="210" font-size="12" fill="currentColor">Stealth if rushed)</text>

  <!-- Loft Office -->
  <rect x="330" y="70" width="300" height="90" fill="none" stroke="currentColor" stroke-width="2.5"/>
  <text x="480" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="currentColor">Loft Office</text>
  <text x="480" y="116" text-anchor="middle" font-size="12" fill="currentColor">Crane's ledger + the meeting point (Scene 3)</text>
  <text x="480" y="132" text-anchor="middle" font-size="12" fill="currentColor">locked crate: soul-vessel core (optional find)</text>

  <text x="450" y="655" text-anchor="middle" font-size="12" fill="currentColor" font-style="italic">Schematic, not to scale — theater-of-the-mind location. Amber path marks the party's actual infiltration route.</text>
</svg>
